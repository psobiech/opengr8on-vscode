# Build, test and package the extension (.vsix). Tag v*: also a GitHub release with the .vsix
# (and its sha256) attached. Tags with a suffix (v0.1.0-rc.1) become pre-releases.
name: CI

on:
  push:
    branches: [ "develop" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # lib/opengr8on-node, bundled from TS source

      - uses: actions/setup-node@v7
        with:
          node-version: 20.x # VS Code 1.85+ extension host runtime (esbuild target node20)
          cache: npm

      - name: Set version from tag
        # package.json keeps the base version; the tag (v0.0.1, v0.0.1-alpha, ...) is the
        # source of truth for the packaged .vsix. Only the CI checkout is modified (package.json +
        # package-lock.json, so `npm ci` stays in sync). Fails on a non-semver tag.
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Package
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          out="$RUNNER_TEMP/vsix" # outside the workspace, so vsce never packs it
          mkdir -p "$out"
          vsix="opengr8on-vscode-${version}.vsix"
          npm run package -- -o "$out/$vsix"
          (cd "$out" && sha256sum "$vsix" > "$vsix.sha256")
          ls -l "$out"

      - name: Upload extension
        uses: actions/upload-artifact@v7
        with:
          name: opengr8on-vscode-vsix
          path: ${{ runner.temp }}/vsix
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: opengr8on-vscode-vsix
          path: assets

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
